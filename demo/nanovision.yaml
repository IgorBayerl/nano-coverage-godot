# nanovision.yaml Configuration
reports:
  - "coverage-report/lcov.info"

source_dirs:
  - "."

output_dir: "coverage-report"

report_types:
  - "Html"
  - "TextSummary"
  - "Lcov"

verbosity: "Info"
log_format: "text"

ignore_files:
  - "logo.gd"
  - "addons/gdUnit4/test/*"
  - "addons/gdUnit4/bin/*"
  - "-**/*_test.go"
