name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Cache
        uses: actions/cache@v6
        with:
          path: .scons_cache/
          key: scons-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.workflow }}
          restore-keys: |
            scons-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: .github/workflows/release.yml

      - name: Install SCons
        run: pip install scons

      # godot-cpp/SConstruct reads SCONS_CACHE and configures SCons CacheDir.
      # Keep the cache directory consistent with the actions/cache path.

      # COMPILE

      - name: Compile (Linux/Windows)
        if: ${{ matrix.platform != 'macos' }}
        # Windows runner auto-detects MSVC. Linux runner auto-detects GCC.
        env:
          SCONS_CACHE: .scons_cache
        run: |
          scons platform=${{ matrix.platform }} target=editor build_tests=no
          scons platform=${{ matrix.platform }} target=template_debug build_tests=no

      - name: Compile (MacOS)
        if: ${{ matrix.platform == 'macos' }}
        env:
          SCONS_CACHE: .scons_cache
        run: |
          scons platform=macos arch=x86_64 target=editor build_tests=no
          scons platform=macos arch=x86_64 target=template_debug build_tests=no
          scons platform=macos arch=arm64 target=editor build_tests=no
          scons platform=macos arch=arm64 target=template_debug build_tests=no

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lib-${{ matrix.platform }}
          path: demo/addons/nano_coverage_godot/bin/

  package:
    name: Package & Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble & Zip
        run: |
          mkdir -p demo/addons/nano_coverage_godot/bin
          
          # Copy binaries
          cp -r artifacts/lib-linux/* demo/addons/nano_coverage_godot/bin/
          cp -r artifacts/lib-windows/* demo/addons/nano_coverage_godot/bin/
          cp -r artifacts/lib-macos/* demo/addons/nano_coverage_godot/bin/

          # Cleanup any temp build files
          rm -f demo/addons/nano_coverage_godot/bin/*.exp
          rm -f demo/addons/nano_coverage_godot/bin/*.lib
          rm -f demo/addons/nano_coverage_godot/bin/*.pdb

          # Zip
          cd demo
          zip -r ../nano_coverage_godot_${{ inputs.version }}.zip addons/

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: NanoCoverage ${{ inputs.version }}
          draft: true
          files: nano_coverage_godot_${{ inputs.version }}.zip
          generate_release_notes: true