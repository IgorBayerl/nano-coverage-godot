name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux
          - platform: linux
            runner: ubuntu-latest
          # Windows (Cross-compile on Linux)
          - platform: windows
            runner: ubuntu-latest
          # MacOS
          - platform: macos
            runner: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: .scons_cache/
          key: ${{ matrix.platform }}-release-${{ github.sha }}
          restore-keys: |
            ${{ matrix.platform }}-release-

      # --- SETUP ---

      - name: Setup Python
        if: ${{ matrix.runner != 'macos-latest' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: |
          python -m pip install scons
          if [ "$RUNNER_OS" == "macOS" ]; then
             brew install scons
          fi

      - name: Install MinGW (Windows Build)
        if: ${{ matrix.platform == 'windows' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      # --- BUILD ---

      - name: Compile Extension
        run: |
          # Now ${{ matrix.platform }} is 'macos', which SCons accepts
          scons platform=${{ matrix.platform }} target=template_release build_tests=no cache_path=.scons_cache/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.platform }}
          path: demo/addons/nano_coverage_godot/bin/

  package:
    name: Package & Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble & Zip
        run: |
          mkdir -p demo/addons/nano_coverage_godot/bin
          
          # Copy binaries
          cp -r artifacts/lib-linux/* demo/addons/nano_coverage_godot/bin/ || true
          cp -r artifacts/lib-windows/* demo/addons/nano_coverage_godot/bin/ || true
          cp -r artifacts/lib-macos/* demo/addons/nano_coverage_godot/bin/ || true

          # Cleanup
          rm -f demo/addons/nano_coverage_godot/bin/*.exp
          rm -f demo/addons/nano_coverage_godot/bin/*.lib

          # Zip
          cd demo
          zip -r ../nano_coverage_godot_${{ inputs.version }}.zip addons/

      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: NanoCoverage ${{ inputs.version }}
          draft: true
          files: nano_coverage_godot_${{ inputs.version }}.zip
          generate_release_notes: true