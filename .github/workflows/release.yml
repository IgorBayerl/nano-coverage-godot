name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux Build (Native)
          - platform: linux
            runner: ubuntu-latest
          # Windows Build (Cross-compile via MinGW on Linux)
          - platform: windows
            runner: ubuntu-latest
          # MacOS Build (Native)
          - platform: macos-latest
            runner: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: .scons_cache/
          key: ${{ matrix.platform }}-release-${{ github.sha }}
          restore-keys: |
            ${{ matrix.platform }}-release-

      # --- 1. SETUP BUILD TOOLS ---
      
      # Install Python (Required for SCons)
      - name: Setup Python
        if: ${{ matrix.runner != 'macos-latest' }} # Mac has python pre-installed
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Install SCons (The Godot Build System)
      - name: Install SCons
        run: |
          python -m pip install scons
          # MacOS might need this if python is system-managed
          if [ "$RUNNER_OS" == "macOS" ]; then
             brew install scons
          fi

      # --- 2. SETUP COMPILERS ---

      # Windows: Install MinGW (Cross-compiler)
      - name: Install MinGW (For Windows Build)
        if: ${{ matrix.platform == 'windows' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      # Linux & Mac: Compilers (GCC/Clang) are PRE-INSTALLED on these runners.
      # No extra action needed.

      # --- 3. COMPILE ---

      - name: Compile Extension
        run: |
          # platform=${{ matrix.platform }} passes 'linux', 'windows', or 'macos' to SCons
          scons platform=${{ matrix.platform }} target=template_release build_tests=no cache_path=.scons_cache/

      # --- 4. UPLOAD ARTIFACTS ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.platform }}
          path: demo/addons/nano_coverage_godot/bin/

  package:
    name: Package & Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble & Zip
        run: |
          mkdir -p demo/addons/nano_coverage_godot/bin
          
          # Copy binaries from the downloaded artifacts folders
          cp -r artifacts/lib-linux/* demo/addons/nano_coverage_godot/bin/ || true
          cp -r artifacts/lib-windows/* demo/addons/nano_coverage_godot/bin/ || true
          cp -r artifacts/lib-macos/* demo/addons/nano_coverage_godot/bin/ || true

          # Cleanup Windows temp files
          rm -f demo/addons/nano_coverage_godot/bin/*.exp
          rm -f demo/addons/nano_coverage_godot/bin/*.lib

          # Create Zip
          cd demo
          zip -r ../nano_coverage_godot_${{ inputs.version }}.zip addons/

      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: NanoCoverage ${{ inputs.version }}
          draft: true
          files: nano_coverage_godot_${{ inputs.version }}.zip
          generate_release_notes: true