name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: .scons_cache/
          key: ${{ matrix.platform }}-release-${{ github.sha }}
          restore-keys: |
            ${{ matrix.platform }}-release-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      # COMPILE

      - name: Compile (Linux/Windows)
        if: ${{ matrix.platform != 'macos' }}
        # Windows runner auto-detects MSVC. Linux runner auto-detects GCC.
        run: |
          scons platform=${{ matrix.platform }} target=template_release build_tests=no cache_path=.scons_cache/

      - name: Compile (MacOS)
        if: ${{ matrix.platform == 'macos' }}
        run: |
          # MacOS usually needs both architectures for a universal build
          scons platform=macos arch=x86_64 target=template_release build_tests=no cache_path=.scons_cache/
          scons platform=macos arch=arm64 target=template_release build_tests=no cache_path=.scons_cache/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.platform }}
          path: demo/addons/nano_coverage_godot/bin/

  package:
    name: Package & Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble & Zip
        run: |
          mkdir -p demo/addons/nano_coverage_godot/bin
          
          # Copy binaries
          cp -r artifacts/lib-linux/* demo/addons/nano_coverage_godot/bin/ || true
          cp -r artifacts/lib-windows/* demo/addons/nano_coverage_godot/bin/ || true
          cp -r artifacts/lib-macos/* demo/addons/nano_coverage_godot/bin/ || true

          # Cleanup any temp build files
          rm -f demo/addons/nano_coverage_godot/bin/*.exp
          rm -f demo/addons/nano_coverage_godot/bin/*.lib
          rm -f demo/addons/nano_coverage_godot/bin/*.pdb

          # Zip
          cd demo
          zip -r ../nano_coverage_godot_${{ inputs.version }}.zip addons/

      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: NanoCoverage ${{ inputs.version }}
          draft: true
          files: nano_coverage_godot_${{ inputs.version }}.zip
          generate_release_notes: true